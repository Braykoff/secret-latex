# Copy to secret-latex.toml in your LaTeX project root and adjust as needed.
# All keys are optional; shown values are the defaults.

[secret-latex]
secrets_file = ".env"  # or "secrets.json", "secrets.yaml" / "secrets.yml"
sources = ["**/*.tex"]
output_dir = "build"
engine = "pdflatex"
engine_args = ["-interaction=nonstopmode"]
# pattern = '\{\{\s*secret\.([A-Za-z_][A-Za-z0-9_]*)(?::([^}]*))?\s*\}\}'
